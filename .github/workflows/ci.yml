name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run type-check

      - name: Build core
        run: bun run build:core

      - name: Build react
        run: bun run build:react

      - name: Run tests
        run: bun run test

      - name: Lint
        run: bun run lint

  publish-check:
    name: Publish dry-run
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Check core package
        working-directory: packages/core
        run: npm pack --dry-run

      - name: Check react package
        working-directory: packages/react
        run: npm pack --dry-run
